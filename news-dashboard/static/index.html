<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>每日热点 — AI · 游戏</title>
    <link rel="stylesheet" href="style.css?v=19" />
</head>
<body>
<header class="app-header">
    <div class="header-left">
        <h1 class="app-title">每日热点</h1>
        <span class="app-subtitle">AI · 游戏</span>
    </div>
    <div class="header-center">
        <span class="date-display" id="dateDisplay"></span>
    </div>
    <div class="header-right">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">就绪</span>
        <button class="btn-refresh" id="btnRefresh" title="手动刷新">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            刷新
        </button>
    </div>
</header>
<nav class="tab-bar">
    <button class="tab active" data-category="ai">AI 动态</button>
    <button class="tab" data-category="gaming">游戏动态</button>
</nav>
<div class="filter-bar" id="filterBar" hidden></div>
<main class="content">
    <section class="dashboard-panel" id="aiDashboard">
        <div class="page-intro">
            <div>
                <span class="page-kicker">TODAY</span>
                <h2>今日 AI 情报</h2>
                <p>重点判断、最新动态、趋势与资源分区呈现。</p>
            </div>
            <span class="page-date" id="aiDate"></span>
        </div>
        <section class="dashboard-section priority-section">
            <div class="section-header"><div><span class="section-eyebrow">今日判断</span><h3>今日重点</h3></div><span class="section-note">不受栏目筛选影响</span></div>
            <div class="priority-list" id="aiPriority"><div class="loading-spinner">加载中...</div></div>
        </section>

        <section class="ai-controls" aria-label="AI 情报筛选">
            <div class="search-bar">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="search" class="search-input" id="searchInput" placeholder="搜索最新动态、趋势和 AI 资源..." autocomplete="off" aria-label="搜索 AI 情报" />
                <button class="search-clear" id="searchClear" aria-label="清除搜索" title="清除搜索">X</button>
            </div>
            <div class="filter-bar ai-filter-bar" id="aiFilterBar"></div>
        </section>

        <div class="ai-section-grid">
            <section class="dashboard-section ai-stream-section" data-ai-section="resources">
                <div class="section-header"><div><span class="section-eyebrow">RESOURCES</span><h3>AI资源</h3></div><div class="section-actions"><span class="section-count" id="resourcesCount"></span><button class="section-toggle" id="resourcesToggle" type="button" data-ai-expand="resources" hidden></button></div></div>
                <div class="compact-list" id="aiResources"></div>
            </section>
            <section class="dashboard-section ai-stream-section" data-ai-section="updates">
                <div class="section-header"><div><span class="section-eyebrow">UPDATES</span><h3>最新动态</h3></div><div class="section-actions"><span class="section-count" id="updatesCount"></span><button class="section-toggle" id="updatesToggle" type="button" data-ai-expand="updates" hidden></button></div></div>
                <div class="compact-list" id="aiUpdates"></div>
            </section>
            <section class="dashboard-section ai-stream-section" data-ai-section="trends">
                <div class="section-header"><div><span class="section-eyebrow">SIGNALS</span><h3>趋势信号</h3></div><div class="section-actions"><span class="section-count" id="trendsCount"></span><button class="section-toggle" id="trendsToggle" type="button" data-ai-expand="trends" hidden></button></div></div>
                <div class="compact-list" id="aiTrends"></div>
            </section>
        </div>

        <section class="dashboard-section github-radar-section">
            <div class="section-header"><div><span class="section-eyebrow">OPEN SOURCE</span><h3>GitHub Radar</h3></div><span class="section-note">最多 5 个项目</span></div>
            <div class="github-radar-grid" id="githubRadar"></div>
        </section>
        <div class="page-updated" id="aiUpdated"></div>
    </section>

    <section class="dashboard-panel" id="gamingDashboard" hidden>
        <div class="page-intro gaming-intro">
            <div>
                <span class="page-kicker">THIS WEEK</span>
                <h2>本周热点同步</h2>
                <p>按手游、端游分组，快速查看版本、赛季和运营节点。</p>
            </div>
            <span class="page-date" id="gamingWeekRange"></span>
        </div>
        <div class="gaming-layout">
            <section class="weekly-board" id="weeklyBoard"><div class="loading-spinner">加载本周热点...</div></section>
            <aside class="today-new-panel">
                <div class="section-header"><div><span class="section-eyebrow">DISCOVERED TODAY</span><h3>今日新增</h3></div></div>
                <div class="today-new-list" id="todayNewList"><div class="loading-spinner">加载中...</div></div>
            </aside>
        </div>
        <div class="page-updated" id="gamingUpdated"></div>
    </section>
</main>
<div class="event-drawer-backdrop" id="eventDrawerBackdrop" hidden></div>
<aside class="event-drawer" id="eventDrawer" aria-hidden="true" aria-label="游戏事件详情">
    <div class="event-drawer-header">
        <span class="section-eyebrow">EVENT DETAIL</span>
        <button class="event-drawer-close" id="eventDrawerClose" type="button" aria-label="关闭事件详情">关闭</button>
    </div>
    <div class="event-drawer-body" id="eventDrawerBody"></div>
</aside>
<footer class="app-footer">
    <span>数据来源：RSS 聚合 · 每30分钟自动更新</span>
    <span>v1.1</span>
</footer>
    <script>window.STATIC_MODE=true;</script>
    <script src="script.js?v=22"></script>
</body>
</html>
